<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        font-family: Inter, -apple-system, system-ui, sans-serif;
        font-size: 12px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        height: 100vh;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
      }
      p.hint {
        margin: 0;
        color: var(--figma-color-text-secondary);
        line-height: 1.45;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      label.field-label {
        font-weight: 600;
      }
      button {
        font: inherit;
        border-radius: 6px;
        border: 1px solid var(--figma-color-border);
        padding: 8px 12px;
        cursor: pointer;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }
      button:hover:not(:disabled) {
        background: var(--figma-color-bg-hover);
      }
      button.primary {
        background: var(--figma-color-bg-brand);
        color: var(--figma-color-text-onbrand);
        border-color: transparent;
      }
      button.primary:hover:not(:disabled) {
        background: var(--figma-color-bg-brand-hover);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      textarea {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        width: 100%;
        min-height: 92px;
        resize: vertical;
        border-radius: 6px;
        border: 1px solid var(--figma-color-border);
        padding: 8px;
        background: var(--figma-color-bg);
        color: var(--figma-color-text);
      }
      input[type='file'] {
        font: inherit;
        color: var(--figma-color-text-secondary);
      }
      .status {
        min-height: 16px;
        line-height: 1.4;
      }
      .status.ok {
        color: var(--figma-color-text-success, #1f9c4d);
      }
      .status.err {
        color: var(--figma-color-text-danger, #d23b3b);
      }
      .divider {
        height: 1px;
        background: var(--figma-color-border);
        margin: 2px 0;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .grow {
        flex: 1;
      }
      .remembered {
        display: none;
        flex-direction: column;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <h1>BaseApp DocLinks</h1>
    <p class="hint">
      Select the links file (generated by <code>generate-link-map</code>), then run.
      Open the page that holds the components first — the plugin scans the
      current page only.
    </p>

    <div class="remembered section" id="remembered">
      <button class="primary" id="runLast">Run with last file</button>
      <p class="hint" id="rememberedHint"></p>
      <div class="divider"></div>
    </div>

    <div class="section">
      <label class="field-label" for="file">Choose a links file (.json)</label>
      <input type="file" id="file" accept="application/json,.json" />
    </div>

    <div class="section grow">
      <label class="field-label" for="paste">…or paste JSON</label>
      <textarea id="paste" class="grow" placeholder='{ "version": 1, "links": [ … ] }'></textarea>
    </div>

    <p class="status" id="status"></p>

    <div class="row">
      <button class="grow primary" id="run" disabled>Run</button>
      <button id="cancel">Close</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id)
      const post = (msg) => parent.postMessage({ pluginMessage: msg }, '*')

      let currentText = '' // the JSON source to run (from file or paste)

      function setStatus(text, kind) {
        const el = $('status')
        el.textContent = text || ''
        el.className = 'status' + (kind ? ' ' + kind : '')
      }

      // Parse + shallow-validate so we can show a count before sending. The
      // main thread does the authoritative validation.
      function summarize(text) {
        const data = JSON.parse(text)
        const links = Array.isArray(data) ? data : data && data.links
        if (!Array.isArray(links)) {
          throw new Error('No `links` array found.')
        }
        return links.length
      }

      function setSource(text, label) {
        currentText = text
        $('run').disabled = !text.trim()
        if (!text.trim()) {
          setStatus('')
          return
        }
        try {
          const count = summarize(text)
          setStatus(`${label}: ${count} link entr${count === 1 ? 'y' : 'ies'} ready.`, 'ok')
        } catch (e) {
          setStatus(`${label}: invalid JSON — ${e.message}`, 'err')
          $('run').disabled = true
        }
      }

      $('file').addEventListener('change', async () => {
        const file = $('file').files && $('file').files[0]
        if (!file) return
        const text = await file.text()
        $('paste').value = ''
        setSource(text, file.name)
      })

      $('paste').addEventListener('input', () => {
        // Clearing the file input lets a fresh file selection re-fire change.
        $('file').value = ''
        setSource($('paste').value, 'Pasted JSON')
      })

      $('run').addEventListener('click', () => {
        let payload
        try {
          payload = JSON.parse(currentText)
        } catch (e) {
          setStatus('Invalid JSON: ' + e.message, 'err')
          return
        }
        setBusy(true)
        setStatus('Running…')
        post({ type: 'run', payload })
      })

      $('runLast').addEventListener('click', () => {
        setBusy(true)
        setStatus('Running with last file…')
        post({ type: 'run-remembered' })
      })

      $('cancel').addEventListener('click', () => post({ type: 'cancel' }))

      function setBusy(busy) {
        $('run').disabled = busy || !currentText.trim()
        $('runLast').disabled = busy
        $('file').disabled = busy
        $('paste').disabled = busy
      }

      window.onmessage = (event) => {
        const msg = event.data.pluginMessage
        if (!msg) return
        if (msg.type === 'init') {
          if (msg.remembered) {
            $('remembered').style.display = 'flex'
            $('rememberedHint').textContent =
              `Last used file had ${msg.remembered.count} entries.`
          }
        } else if (msg.type === 'error') {
          setBusy(false)
          setStatus(msg.message, 'err')
        }
      }

      // Ask the main thread whether a previous file is remembered.
      post({ type: 'request-init' })
    </script>
  </body>
</html>
